# PDexFlow evaluation: samples peptides for every complex of a split and reports
# AAR (amino-acid recovery), CA-RMSD, chirality error, novelty, diversity and efficiency statistics.
# Rosetta / MD based numbers (Aff., Stb.) are not computed here; they can be read from external CSVs (eval.orthogonal / eval.dynamic).
data:
  structure_dir: data/pepmerge
  cache_dir: .cache/pepmerge
  split: test
  reset_cache: false

train:
  seed: 0

model:
  trunk_type: geometric
  n_rbf: 16
  d_model: 256
  n_layers: 6
  n_heads: 8
  dropout: 0.0
  max_len: 512
  aatype_vocab: 21
  angle_dim: 5
  coord_scale: 0.1

flow:
  sigma_trans: 0.1
  use_ot: true
  ot_mode: minibatch
  num_steps: 30
  angle_purify: true

chi_lora:
  enable: false
  rank: 8
  alpha: 16.0
  dropout: 0.0
  targets: [attn, ffn]
  freeze_backbone: false

esm:
  enable: false

afi:
  enable: false

sample:
  device: cuda
  ckpt_path: null                    # required
  output_dir: outputs/eval
  max_eval: 100
  num_steps: 30
  use_hard_decoder: true
  # chirality_token: 1               # default: 1 when eval.dataset_x_mirror is true, else 0

eval:
  dataset_name: pepmerge_test        # PepDataset split name (train | test | all)
  dataset_x_mirror: false            # true: evaluate on the parity-mirrored (D) version of the split
  save_examples: 3
  reference:                         # novelty / diversity reference bank (training split)
    enable: false
    dataset_name: pepmerge_train
    x_mirror: false
    max_samples: 200
    embed_max_samples: 200
  scaling:
    peptide_bins: [3, 8, 13, 18, 26]
    receptor_bins: [0, 100, 200, 400, 1000]
  generalization:
    seq_identity_bins: [0.0, 0.3, 0.5, 0.7, 1.01]
  diversity:
    cluster_distance_threshold: 1.0
  dynamic:                           # optional externally computed MD statistics
    enable: false
    md_csv: null
  orthogonal:                        # optional externally computed Rosetta scores
    enable: false
    csv_path: null
    rosetta_col: rosetta
    orth_col: score
  training_cost:
    gpu_count: 1
    gpu_hours: 0.0
    peak_mem_mb: 0.0
