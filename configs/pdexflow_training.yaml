# PDexFlow backbone training (mirror-symmetric strategy on PepMerge-style data).
# Override on the CLI, e.g.  data.structure_dir=/path/to/PepMerge train.max_iters=2000
defaults:
  - model: default
  - flow: default
  - chi_lora: disabled
  - esm: disabled
  - _self_

data:
  structure_dir: data/pepmerge       # one sub-directory per complex with peptide.pdb + pocket.pdb
  cache_dir: .cache/pepmerge         # LMDB caches are built here on first run
  split: train                       # train | test | all (test ids: src/data/test_ids.txt)
  reset_cache: false                 # set true once after changing the parity convention

train:
  seed: 0
  device: cuda                       # falls back to cpu when CUDA is unavailable
  batch_size: 16
  num_workers: 4
  max_iters: 100000
  save_freq: 5000
  max_grad_norm: 1.0
  use_amp: true
  grad_accum_steps: 1
  logdir: outputs/logs
  optimizer:
    lr: 1.0e-4
    weight_decay: 0.0
