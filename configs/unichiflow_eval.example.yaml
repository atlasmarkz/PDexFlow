# UniChiFlow comprehensive evaluation config
# Copy to config.yaml and modify paths as needed

hydra:
  run:
    dir: outputs/logs/${now:%Y-%m-%d}/${now:%H-%M-%S}

train:
  seed: 2024
  device: cuda

data:
  structure_dir: data/pepmerge         # Path to preprocessed PDB structures
  cache_dir: .cache/pep_cache          # LMDB cache
  reset_cache: false

model:
  d_model: 256
  n_layers: 6
  n_heads: 8
  dropout: 0.0
  max_len: 1024
  aatype_vocab: 21
  angle_dim: 5

flow:
  sigma_trans: 0.1
  angle_purify: true
  use_ot: true

esm:
  enable: true
  model: esm2_t12_35M_UR50D
  repr_layer: -1
  requires_grad: false
  use_adapter: true
  rank: 8
  alpha: 8.0
  dropout: 0.0

chi_lora:
  enable: false
  rank: 8
  alpha: 16.0
  dropout: 0.0
  targets: [attn_out, ffn]
  freeze_backbone: true

sample:
  # Override via CLI:
  #   python -m src.scripts.eval_unichiflow sample.ckpt_path=/path/to/ckpt.pt
  ckpt_path: outputs/checkpoints/best_model.pt
  device: cuda
  num_steps: 50
  max_eval: 64
  use_hard_decoder: true
  output_dir: outputs/eval

eval:
  dataset_name: pepmerge_test
  dataset_x_mirror: false
  save_examples: 3

  reference:
    enable: true
    dataset_name: pepmerge_train
    x_mirror: true
    max_samples: 200
    embed_max_samples: 200

  scaling:
    peptide_bins: [6, 8, 10, 12, 16, 24, 32]
    receptor_bins: [32, 64, 128, 256, 512, 1024]

  diversity:
    cluster_distance_threshold: 0.35

  generalization:
    seq_identity_bins: [0.3, 0.5, 0.7, 0.9]

  dynamic:
    enable: false
    md_csv: ""

  orthogonal:
    enable: false
    csv_path: ""
    rosetta_col: rosetta_score
    orth_col: orth_score

  training_cost:
    gpu_count: 1
    gpu_hours: 0.0
    peak_mem_mb: 0.0
