# UniChiFlow LoRA fine-tuning config for Real D-Peptides
# Copy to config.yaml and modify paths as needed

train:
  seed: 2024
  device: cuda
  num_workers: 8
  batch_size: 16
  max_iters: 2000
  save_freq: 200
  logdir: outputs_lora/               # LoRA training output directory
  max_grad_norm: 1.0
  optimizer:
    lr: 2e-4
    weight_decay: 0.0

data:
  structure_dir: data/d_pep_structures # Path to D-peptide PDB structures
  cache_dir: .cache/pep_cache_lora_d  # LMDB cache for D-peptide data
  split: train
  reset_cache: true
  peptide_subdir: null                 # e.g., "peptide" for pepmerge layout; null = use all
  skip_receptor: false
  twin_universe_prob: 0.0             # Real D-peptides; mirroring handled in dataset

model:
  d_model: 256
  n_layers: 6
  n_heads: 8
  dropout: 0.1
  max_len: 512
  aatype_vocab: 21

flow:
  sigma_trans: 0.1
  num_steps: 30
  angle_purify: true
  use_ot: true
  auto_loss_weighting: true

esm:
  enable: true
  model: esm2_t12_35M_UR50D
  repr_layer: -1
  requires_grad: false
  use_adapter: true
  rank: 8
  alpha: 8.0
  dropout: 0.0

chi_lora:
  enable: true                        # ChiLoRA adapter enabled for D-peptide fine-tuning
  rank: 8
  alpha: 16.0
  dropout: 0.05
  targets: [attn_out, ffn]
  freeze_backbone: true

sample:
  # Path to backbone checkpoint - override via CLI:
  #   python -m src.experiments.train_lora_real_d sample.ckpt_path=/path/to/backbone.pt
  ckpt_path: "outputs/checkpoints/best_model.pt"
  device: cuda
