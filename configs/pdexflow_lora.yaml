# Chiral-Bridge LoRA fine-tuning on a real D-peptide set (paper Sec. IV-B): the pre-trained backbone is frozen and only the
# LoRA matrices and the chiral gate gamma are trained. Run with  python -m src.experiments.train_lora_real_d.
# Needs sample.ckpt_path=<backbone checkpoint trained with pdexflow_training.yaml> (same model.* sizes).
defaults:
  - model: default
  - flow: default
  - chi_lora: finetune
  - esm: disabled
  - _self_

data:
  structure_dir: data/real_d         # folder with D-peptide PDB files (searched recursively)
  cache_dir: .cache/real_d
  split: train
  reset_cache: false
  chirality_mode: real_d             # real_d: coordinates as-is | mirrored_l_to_d: apply the parity operator while parsing
  peptide_subdir: null
  skip_receptor: true

train:
  seed: 0
  device: cuda                       # falls back to cpu when CUDA is unavailable
  batch_size: 16
  num_workers: 4
  max_iters: 5000
  save_freq: 500
  max_grad_norm: 1.0
  use_amp: true
  grad_accum_steps: 1
  logdir: outputs/logs
  optimizer:
    lr: 1.0e-4
    weight_decay: 0.0

sample:
  ckpt_path: null                    # pre-trained backbone checkpoint (required for fine-tuning)
