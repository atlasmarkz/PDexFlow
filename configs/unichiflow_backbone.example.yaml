# UniChiFlow core config (ChiLoRA excluded)
# Copy to config.yaml and modify paths as needed

train:
  seed: 2024
  device: cuda
  num_workers: 12
  batch_size: 384
  max_iters: 10000
  save_freq: 1000
  logdir: outputs/                    # Training output directory
  max_grad_norm: 3
  max_grad_value: 5.0
  grad_accum_steps: 2
  use_amp: false
  optimizer:
    lr: 5e-4
    weight_decay: 0.0

data:
  structure_dir: data/pepmerge       # Path to preprocessed PDB structures
  cache_dir: .cache/pep_cache        # LMDB cache for preprocessed data
  split: train                       # train | test | all
  reset_cache: false
  twin_universe_prob: 1.0            # Probability of applying L->D mirror during training
  deterministic_pairs: false         # Disable L/D pair mixing if true

model:
  d_model: 256
  n_layers: 6
  n_heads: 8
  dropout: 0.1
  max_len: 512
  aatype_vocab: 21                   # 20 aa + mask
  angle_dim: 5

flow:
  sigma_min: 0.0001
  sigma_trans: 0.1
  cfm_weight: 1
  sym_weight: 1
  seq_weight: 1
  cfm_w_trans: 1.0
  cfm_w_rot: 1.0
  cfm_w_ang: 1.0
  num_steps: 30
  angle_purify: true
  use_ot: true                       # Enable minibatch optimal transport alignment
  auto_loss_weighting: true         # Use learnable log_vars to weight loss terms
  sym_warmup_enable: false
  sym_warmup_start: 500
  sym_warmup_end: 2000

esm:
  enable: true
  model: esm2_t12_35M_UR50D          # ESM2 model variant
  repr_layer: -1
  requires_grad: false
  use_adapter: true
  rank: 8
  alpha: 8.0
  dropout: 0.0

chi_lora:
  enable: false
  rank: 8
  alpha: 16.0
  dropout: 0.05
  targets: [attn_out, ffn]
  freeze_backbone: true
