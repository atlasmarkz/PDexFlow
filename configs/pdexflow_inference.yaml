# PDexFlow sampling. chirality_token: 0 = L-peptide, 1 = D-peptide (Hard Geometric Constraint decoder).
data:
  use_pepmerge: true
  structure_dir: data/pepmerge
  cache_dir: .cache/pepmerge
  split: test
  reset_cache: false

train:
  seed: 0

model:
  trunk_type: geometric
  n_rbf: 16
  d_model: 256
  n_layers: 6
  n_heads: 8
  dropout: 0.0
  max_len: 512
  aatype_vocab: 21
  angle_dim: 5
  coord_scale: 0.1

flow:
  sigma_trans: 0.1
  use_ot: true
  ot_mode: minibatch
  num_steps: 30
  angle_purify: true

chi_lora:
  enable: false
  rank: 8
  alpha: 16.0
  dropout: 0.0
  targets: [attn, ffn]
  freeze_backbone: false

esm:
  enable: false

afi:
  enable: false

sample:
  device: cuda                       # cuda | mps | cpu (auto fallback)
  ckpt_path: null                    # required: path to a training checkpoint
  lora_ckpt_path: null               # optional Chiral-Bridge LoRA checkpoint (needs chi_lora.enable=true)
  output_dir: outputs/peptides
  num_samples: 10
  num_steps: 30
  chirality_token: 1
  use_hard_decoder: true
