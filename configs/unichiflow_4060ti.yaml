# UniChiFlow training config for RTX 4060 Ti (8 hours)
# ESM2 enabled, ChiLoRA disabled

train:
  seed: 2024
  device: cuda
  num_workers: 0
  batch_size: 16
  max_iters: 4500
  save_freq: 500
  logdir: outputs/
  max_grad_norm: 3
  max_grad_value: 5.0
  grad_accum_steps: 1
  use_amp: true
  optimizer:
    lr: 1e-4
    weight_decay: 0.01

data:
  structure_dir: data/pepmerge
  cache_dir: .cache/pep_cache
  split: train
  reset_cache: false
  twin_universe_prob: 1.0
  deterministic_pairs: false
  use_subset: false
  subset_fraction: 0.3
  subset_mirror_prob: 1.0

model:
  d_model: 192
  n_layers: 6
  n_heads: 8
  dropout: 0.1
  max_len: 512
  aatype_vocab: 21
  angle_dim: 5

flow:
  sigma_min: 0.001
  sigma_trans: 0.5
  cfm_weight: 1
  sym_weight: 1
  seq_weight: 1
  cfm_w_trans: 1.0
  cfm_w_rot: 1.0
  cfm_w_ang: 1.0
  num_steps: 30
  angle_purify: true
  use_ot: false
  auto_loss_weighting: false
  sym_warmup_enable: true
  sym_warmup_start: 1000
  sym_warmup_end: 6000

esm:
  enable: true
  model: esm2_t12_35M_UR50D
  repr_layer: -1
  requires_grad: false
  use_adapter: true
  rank: 8
  alpha: 8.0
  dropout: 0.0

chi_lora:
  enable: false
  rank: 8
  alpha: 16.0
  dropout: 0.05
  targets: [attn_out, ffn]
  freeze_backbone: true