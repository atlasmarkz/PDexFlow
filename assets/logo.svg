<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="PDexFlow logo">
  <title>PDexFlow</title>
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="d" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9333ea"/><stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <!-- mirror plane (parity) -->
  <line x1="60" y1="8" x2="60" y2="112" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/>
  <!-- L-peptide backbone flow (left) -->
  <path d="M54 24 C18 30, 14 60, 40 66 S52 94, 54 98" fill="none" stroke="url(#l)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="54" cy="24" r="7" fill="url(#l)"/><circle cx="40" cy="66" r="7" fill="url(#l)"/><circle cx="54" cy="98" r="7" fill="url(#l)"/>
  <!-- D-peptide mirror image (right) -->
  <path d="M66 24 C102 30, 106 60, 80 66 S68 94, 66 98" fill="none" stroke="url(#d)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="66" cy="24" r="7" fill="url(#d)"/><circle cx="80" cy="66" r="7" fill="url(#d)"/><circle cx="66" cy="98" r="7" fill="url(#d)"/>
</svg>
