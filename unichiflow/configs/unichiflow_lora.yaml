# UniChiFlow LoRA fine-tuning config for Real D-Peptides

train:
  seed: 2024
  device: cuda
  num_workers: 8
  batch_size: 16
  max_iters: 2000
  save_freq: 200
  logdir: /root/autodl-fs/UniChiflow/outputs_lora
  max_grad_norm: 1.0
  optimizer:
    lr: 2e-4  # Slightly lower LR for fine-tuning
    weight_decay: 0.0

data:
  structure_dir: /root/autodl-tmp/d_pep_structures
  cache_dir: /root/autodl-fs/UniChiflow/pep_cache_lora_d
  split: train
  reset_cache: true
  peptide_subdir: null    # e.g., "peptide" for pepmerge layout; null means use all
  skip_receptor: false    # skip files in receptor folders when pepmerge is used
  twin_universe_prob: 0.0   # Real D-peptides; mirroring handled in dataset (x_mirror)

model:
  d_model: 256
  n_layers: 6
  n_heads: 8
  dropout: 0.1
  max_len: 512
  aatype_vocab: 21

flow:
  sigma_trans: 1.0
  num_steps: 30
  angle_purify: true
  use_ot: true
  auto_loss_weighting: true # Enable receiving learned loss weights from Stage 1

esm:
  enable: true # Should match backbone training setting to ensure architectural compatibility
  model: esm2_t12_35M_UR50D
  repr_layer: -1
  requires_grad: false
  use_adapter: true
  rank: 8
  alpha: 8.0
  dropout: 0.0

# Parameter-efficient adapter
chi_lora:
  enable: true
  rank: 8
  alpha: 16.0
  dropout: 0.05
  targets: [attn_out, ffn] # Matching backbone training config for consistency
  freeze_backbone: true  # Freeze backbone to train only LoRA adapters

sample:
  ckpt_path: "/root/autodl-fs/UniChiflow/outputs/2026_01_16__21_07_46/checkpoints/best_model.pt" # MUST BE SET to the result of Stage 1 (pepmerge) training
  device: cuda

