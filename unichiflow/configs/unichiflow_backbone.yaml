# UniChiFlow core config (ChiLoRA excluded)

train:
  seed: 2024
  device: cuda
  num_workers: 12
  batch_size: 384
  max_iters: 10000
  save_freq: 1000
  logdir: /root/autodl-fs/UniChiflow/outputs
  max_grad_norm: 3
  max_grad_value: 5.0   # clip individual grad values to avoid explosions
  grad_accum_steps: 2
  use_amp: false
  optimizer:
    lr: 5e-4
    weight_decay: 0.0

data:
  structure_dir: /root/autodl-tmp/pepmerge
  cache_dir: /root/autodl-fs/UniChiflow/pep_cache
  split: train   # train|test|all
  reset_cache: false
  twin_universe_prob: 1.0   # 1.0 means always mirror (L->D), training purely on D-space
  deterministic_pairs: false # Disable mixing L and D pairs. Train on D-only distribution.

model:
  d_model: 256
  n_layers: 6
  n_heads: 8
  dropout: 0.1
  max_len: 512
  aatype_vocab: 21  # 20 aa + mask
  angle_dim: 5

flow:
  sigma_min: 0.0001
  sigma_trans: 0.5
  cfm_weight: 1     # Increased to give flow more signal
  sym_weight: 1     # Reduced to balance with cfm (prev 1.0 vs 0.001 was unbalanced)
  seq_weight: 1
  # per-component cfm weights (trans, rot, ang)
  cfm_w_trans: 1.0
  cfm_w_rot: 1.0
  cfm_w_ang: 1.0
  num_steps: 30
  angle_purify: true
  use_ot: true # enable minibatch OT alignment during training
  auto_loss_weighting: true # use learnable log_vars to weight multiple loss terms

  # Symmetry loss warmup schedule (steps)
  sym_warmup_enable: false
  sym_warmup_start: 500
  sym_warmup_end: 2000

# Optional frozen ESM conditioner
esm:
  enable: true
  model: esm2_t12_35M_UR50D
  repr_layer: -1
  requires_grad: false
  use_adapter: true   # set false to remove Chiral-Bridge adapter (plain frozen ESM projection)
  rank: 8
  alpha: 8.0
  dropout: 0.0

# Parameter-efficient adapter (optional)
chi_lora:
  enable: false
  rank: 8
  alpha: 16.0
  dropout: 0.05
  targets: [attn_out, ffn]
  freeze_backbone: true
